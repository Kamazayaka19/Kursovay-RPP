services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - mfc_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  mfc_data:
